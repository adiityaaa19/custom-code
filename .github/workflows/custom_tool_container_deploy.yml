name: Deploy Tool to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      tool_id:
        description: "tool id (unique container/image name, e.g. toolid_userid_xxx)"
        required: true
      unique_id:
        description: "Unique identifier for tracking this workflow run"
        required: true
      tool_dir:
        description: "Path to tool directory (e.g. tools_studio/tool-id)"
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Initialize Result JSON
        run: |
          mkdir -p output
          cat > output/result_${{ inputs.unique_id }}.json << 'EOF'
          {
            "run_id": "${{ github.run_id }}",
            "status": "running",
            "tool_id": "${{ inputs.tool_id }}",
            "unique_id": "${{ inputs.unique_id }}",
            "tool_dir": "${{ inputs.tool_dir }}",
            "operation": "deploy",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "completed_at": null,
            "endpoint": null,
            "error": null,
            "message": "Starting deployment process"
          }
          EOF

      - name: Validate deployment ID format
        run: |
          if ! [[ "${{ inputs.tool_id }}" =~ ^[a-z0-9-]{1,32}$ ]]; then
            echo "::error::Invalid tool_id format. Must be lowercase alphanumeric with hyphens, max 32 chars."
            cat > output/result_${{ inputs.unique_id }}.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "tool_id": "${{ inputs.tool_id }}",
            "unique_id": "${{ inputs.unique_id }}",
            "tool_dir": "${{ inputs.tool_dir }}",
            "operation": "deploy",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "endpoint": null,
            "error": "Invalid tool_id format",
            "message": "Invalid tool_id format. Must be lowercase alphanumeric with hyphens, max 32 chars."
          }
          EOF
            exit 1
          fi

      - name: Verify tool directory exists
        run: |
          if [ ! -d "${{ inputs.tool_dir }}" ]; then
            echo "::error::Tool directory '${{ inputs.tool_dir }}' not found"
            cat > output/result_${{ inputs.unique_id }}.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "tool_id": "${{ inputs.tool_id }}",
            "unique_id": "${{ inputs.unique_id }}",
            "tool_dir": "${{ inputs.tool_dir }}",
            "operation": "deploy",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "endpoint": null,
            "error": "Tool directory not found",
            "message": "Tool directory '${{ inputs.tool_dir }}' not found"
          }
          EOF
            exit 1
          fi

          if [ ! -f "${{ inputs.tool_dir }}/Dockerfile" ]; then
            echo "::error::Dockerfile not found in ${{ inputs.tool_dir }}"
            cat > output/result_${{ inputs.unique_id }}.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "tool_id": "${{ inputs.tool_id }}",
            "unique_id": "${{ inputs.unique_id }}",
            "tool_dir": "${{ inputs.tool_dir }}",
            "operation": "deploy",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "endpoint": null,
            "error": "Dockerfile not found",
            "message": "Dockerfile not found in ${{ inputs.tool_dir }}"
          }
          EOF
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Image
        run: |
          echo "Building Docker image from ${{ inputs.tool_dir }}..."
          docker build -t ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ inputs.tool_id }}:latest ${{ inputs.tool_dir }}
          echo ${{ secrets.AZURE_ACR_PASSWORD }} | docker login ${{ secrets.AZURE_CONTAINER_REGISTRY }} -u ${{ secrets.AZURE_ACR_USERNAME }} --password-stdin
          docker push ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ inputs.tool_id }}:latest

          cat > output/result_${{ inputs.unique_id }}.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "processing",
            "tool_id": "${{ inputs.tool_id }}",
            "unique_id": "${{ inputs.unique_id }}",
            "tool_dir": "${{ inputs.tool_dir }}",
            "operation": "deploy",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "completed_at": null,
            "endpoint": null,
            "error": null,
            "message": "Docker image built and pushed successfully"
          }
          EOF

      - name: Deploy or Update Azure Container App
        id: deploy
        run: |
          set -e
          echo "Checking for existing container app..."
          EXISTING_APP=$(az containerapp show --name ${{ inputs.tool_id }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query name -o tsv || echo "")

          if [ -z "$EXISTING_APP" ]; then
            echo "Creating new container app..."
            az containerapp create \
              --name ${{ inputs.tool_id }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ inputs.tool_id }}:latest \
              --environment ${{ secrets.AZURE_CONTAINERAPPS_ENVIRONMENT }} \
              --ingress external --target-port 8000 \
              --registry-server ${{ secrets.AZURE_CONTAINER_REGISTRY }} \
              --registry-username ${{ secrets.AZURE_ACR_USERNAME }} \
              --registry-password ${{ secrets.AZURE_ACR_PASSWORD }}
          else
            echo "Updating existing container app..."
            az containerapp update \
              --name ${{ inputs.tool_id }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ inputs.tool_id }}:latest
          fi

          echo "Retrieving application URL..."
          APP_URL=$(az containerapp show --name ${{ inputs.tool_id }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "DEPLOYED_URL=https://$APP_URL/mcp" >> $GITHUB_ENV
          echo "DEPLOYED_URL=https://$APP_URL/mcp" >> $GITHUB_OUTPUT

          cat > output/result_${{ inputs.unique_id }}.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "success",
            "tool_id": "${{ inputs.tool_id }}",
            "unique_id": "${{ inputs.unique_id }}",
            "tool_dir": "${{ inputs.tool_dir }}",
            "operation": "deploy",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "endpoint": "https://$APP_URL/sse",
            "error": null,
            "message": "Deployment completed successfully"
          }
          EOF

      - name: Display Results
        if: always()
        run: |
          echo "=== Deployment Result ==="
          if [ -f output/result_${{ inputs.unique_id }}.json ]; then
            cat output/result_${{ inputs.unique_id }}.json | jq . || cat output/result_${{ inputs.unique_id }}.json
          fi

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "result_${{ inputs.unique_id }}"
          path: "output/result_${{ inputs.unique_id }}.json"
