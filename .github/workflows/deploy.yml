name: Assign User to MCP Pool

on:
  workflow_dispatch:
    inputs:
      user_id:
        required: true
      user_api_key:  # User's key (if needed)
        required: false
      tavily_api_key:  # Tavily's key
        required: true

jobs:
  assign-user:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inject Credentials
        run: |
          az containerapp update \
            --name mcp-generic-pool \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --set-env-vars \
              "USER_ID=${{ github.event.inputs.user_id }}" \
              "USER_API_KEY=${{ github.event.inputs.user_api_key }}" \
              "TAVILY_API_KEY=${{ github.event.inputs.tavily_api_key }}"

      - name: Generate User URL
        run: |
          APP_URL=$(az containerapp show \
            --name mcp-generic-pool \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "USER_URL=https://$APP_URL/user/${{ github.event.inputs.user_id }}/mcp" >> $GITHUB_OUTPUT
