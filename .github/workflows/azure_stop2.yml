name: Stop Azure Container App by Deactivating Revisions

on:
  workflow_dispatch:
    inputs:
      container_app_name:
        description: 'Name of the Container App to stop'
        required: true
        type: string
      subscription_id:
        description: 'Azure Subscription ID'
        required: true
        type: string

jobs:
  stop:
    runs-on: ubuntu-latest
    outputs:
      revisions: ${{ steps.get_revisions.outputs.revisions }}
      result: ${{ steps.set_result.outputs.result }}
    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Container App Exists
        id: validate_app
        run: |
          set +e
          echo "Checking if container app '${{ github.event.inputs.container_app_name }}' exists..."
          
          # Check if the container app exists
          app_info=$(az containerapp show \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "name" \
            -o tsv 2>&1)
          
          if [[ $? -ne 0 ]]; then
            if [[ "$app_info" == *"ResourceNotFound"* ]] || [[ "$app_info" == *"was not found"* ]]; then
              echo "error_type=not_found" >> $GITHUB_OUTPUT
              echo "Container app '${{ github.event.inputs.container_app_name }}' not found" > result.txt
              echo "failure" >> result.txt
              exit 1
            else
              echo "error_type=unknown" >> $GITHUB_OUTPUT
              echo "Error checking container app: $app_info" > result.txt
              echo "failure" >> result.txt
              exit 1
            fi
          fi
          
          echo "Container app found: $app_info"
          echo "app_exists=true" >> $GITHUB_OUTPUT

      - name: Get Active Revisions
        id: get_revisions
        if: steps.validate_app.outputs.app_exists == 'true'
        run: |
          set +e
          echo "Getting active revisions for '${{ github.event.inputs.container_app_name }}'..."
          
          revisions=$(az containerapp revision list \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "[?properties.active].name" \
            -o tsv 2>&1)
          
          if [[ $? -ne 0 ]]; then
            echo "Error getting revisions: $revisions"
            echo "Error retrieving active revisions" > result.txt
            echo "failure" >> result.txt
            exit 1
          fi
          
          echo "Found revisions: $revisions"
          echo "revisions=$revisions" >> $GITHUB_OUTPUT
          echo "$revisions" > revisions.txt
          
          # Count revisions for logging
          if [[ -z "$revisions" ]]; then
            echo "revision_count=0" >> $GITHUB_OUTPUT
          else
            revision_count=$(echo "$revisions" | wc -w)
            echo "revision_count=$revision_count" >> $GITHUB_OUTPUT
            echo "Found $revision_count active revision(s)"
          fi

      - name: Deactivate Revisions
        id: deactivate
        if: steps.get_revisions.outputs.revisions != '' && steps.get_revisions.outputs.revision_count != '0'
        run: |
          echo "Deactivating revisions for '${{ github.event.inputs.container_app_name }}'..."
          success_count=0
          total_count=0
          
          for rev in ${{ steps.get_revisions.outputs.revisions }}; do
            total_count=$((total_count + 1))
            echo "Deactivating revision $total_count: $rev"
            
            if az containerapp revision deactivate \
              --name "${{ github.event.inputs.container_app_name }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --revision "$rev" > "deactivate_$rev.log" 2>&1; then
              echo "✅ Successfully deactivated revision: $rev"
              success_count=$((success_count + 1))
            else
              echo "❌ Failed to deactivate revision: $rev"
              cat "deactivate_$rev.log"
              echo "Failed to deactivate revision $rev" > result.txt
              echo "failure" >> result.txt
              exit 1
            fi
          done
          
          echo "Successfully deactivated $success_count/$total_count revisions"
          echo "Container app stopped successfully" > result.txt
          echo "success" >> result.txt

      - name: Handle Already Stopped Case
        if: steps.get_revisions.outputs.revisions == '' || steps.get_revisions.outputs.revision_count == '0'
        run: |
          echo "Container app '${{ github.event.inputs.container_app_name }}' has no active revisions - already stopped"
          echo "Container app was already stopped" > result.txt
          echo "success" >> result.txt

      - name: Set Final Result
        id: set_result
        if: always()
        run: |
          if [ -f result.txt ]; then
            result_content=$(cat result.txt)
            echo "result<<EOF" >> $GITHUB_OUTPUT
            echo "$result_content" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "Final result: $result_content"
          else
            echo "No result file found - operation status unknown"
            echo "Operation completed but status unknown" > result.txt
            echo "unknown" >> result.txt
            echo "result=Operation completed but status unknown" >> $GITHUB_OUTPUT
          fi

      - name: Upload Result Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop-result-${{ github.event.inputs.container_app_name }}
          path: result.txt
          retention-days: 1  # Reduce retention to clean up faster

      - name: Upload Revision List
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop-revisions-${{ github.event.inputs.container_app_name }}
          path: revisions.txt
          retention-days: 1

      - name: Upload Deactivation Logs
        if: steps.get_revisions.outputs.revisions != '' && steps.get_revisions.outputs.revision_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: stop-logs-${{ github.event.inputs.container_app_name }}
          path: deactivate_*.log
          retention-days: 1
