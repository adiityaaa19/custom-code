name: Start Azure Container App by Activating Revisions

on:
  workflow_dispatch:
    inputs:
      container_app_name:
        description: 'Name of the Container App to start'
        required: true
        type: string
      resource_group:
        description: 'Azure Resource Group'
        required: true
        type: string
      subscription_id:
        description: 'Azure Subscription ID'
        required: true
        type: string

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Inactive Revisions
        id: get_revisions
        run: |
          set +e
          # Get all inactive revisions
          revisions=$(az containerapp revision list \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ github.event.inputs.resource_group }}" \
            --query "[?properties.active==\`false\`].name" \
            -o tsv)
          
          if [ -z "$revisions" ]; then
            echo "No inactive revisions found - app may already be running"
            echo "REVISIONS=" >> $GITHUB_ENV
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "Found inactive revisions: $revisions"
            echo "REVISIONS=$revisions" >> $GITHUB_ENV
            echo "status=pending" >> $GITHUB_OUTPUT
          fi
          echo "$revisions" > revisions.txt

      - name: Activate Revisions
        if: env.REVISIONS != ''
        run: |
          set +e
          for rev in $REVISIONS; do
            echo "Activating revision: $rev"
            az containerapp revision activate \
              --name "${{ github.event.inputs.container_app_name }}" \
              --resource-group "${{ github.event.inputs.resource_group }}" \
              --revision "$rev" > activate_$rev.log 2>&1
            STATUS=$?
            if [ $STATUS -ne 0 ]; then
              echo "Failed to activate revision $rev"
              cat activate_$rev.log
              echo "failure" > result.txt
              exit 1
            fi
          done
          echo "success" > result.txt

      - name: Handle Already Running Case
        if: env.REVISIONS == ''
        run: |
          echo "App was already running - no revisions to activate"
          echo "success" > result.txt

      - name: Upload Result Artifact
        uses: actions/upload-artifact@v4
        with:
          name: start-result-${{ github.event.inputs.container_app_name }}
          path: result.txt

      - name: Upload Revision List
        uses: actions/upload-artifact@v4
        with:
          name: start-revisions-${{ github.event.inputs.container_app_name }}
          path: revisions.txt

      - name: Upload Activation Logs
        if: env.REVISIONS != ''
        uses: actions/upload-artifact@v4
        with:
          name: start-logs-${{ github.event.inputs.container_app_name }}
          path: activate_*.log
