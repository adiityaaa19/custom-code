name: Start Azure Container App

on:
  workflow_dispatch:
    inputs:
      container_app_name:
        description: 'Name of the Container App to start'
        required: true
        type: string
      resource_group:
        description: 'Azure Resource Group'
        required: true
        type: string
      subscription_id:
        description: 'Azure Subscription ID'
        required: true
        type: string

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Latest Revision
        id: get_revision
        run: |
          revision=$(az containerapp revision list \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ github.event.inputs.resource_group }}" \
            --query "sort_by([].{name:name,created:properties.createdTime}, &created)[-1].name" \
            -o tsv)
          echo "REVISION=$revision" >> $GITHUB_ENV
          echo "$revision" > revision.txt

      - name: Activate Revision
        run: |
          az containerapp revision activate \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ github.event.inputs.resource_group }}" \
            --revision "$REVISION" >> activate_log.txt 2>&1
          echo "success" > result.txt

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: start-result-${{ github.event.inputs.container_app_name }}
          path: |
            result.txt
            revision.txt
            activate_log.txt
