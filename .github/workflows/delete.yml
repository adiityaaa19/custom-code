name: Delete Azure Container App

on:
  workflow_dispatch:
    inputs:
      container_app_name:
        description: 'Name of the Azure Container App to delete'
        required: true

jobs:
  delete-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Initialize Result JSON
        run: |
          mkdir -p output
          cat > output/result.json << 'EOF'
          {
            "run_id": "${{ github.run_id }}",
            "status": "running",
            "container_app_name": "${{ inputs.container_app_name }}",
            "operation": "delete",
            "error": null,
            "message": "Starting container app deletion process"
          }
          EOF

      - name: Check Container App Exists
        id: check_app
        run: |
          set +e
          APP_NAME="${{ inputs.container_app_name }}"
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          
          echo "Checking if container app exists: $APP_NAME in resource group: $RESOURCE_GROUP"
          
          # Check if app exists
          app_check=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "name" \
            -o tsv 2>&1)
          
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Container app not found: $app_check"
            echo "app_exists=false" >> $GITHUB_OUTPUT
            
            cat > output/result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "container_app_name": "$APP_NAME",
            "operation": "delete",
            "error": "Container app not found",
            "message": "Container app '$APP_NAME' does not exist in resource group '$RESOURCE_GROUP'"
          }
          EOF
          else
            echo "Container app found: $app_check"
            echo "app_exists=true" >> $GITHUB_OUTPUT
            
            cat > output/result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "processing",
            "container_app_name": "$APP_NAME",
            "operation": "delete",
            "resource_group": "$RESOURCE_GROUP",
            "error": null,
            "message": "Container app found, proceeding with deletion"
          }
          EOF
          fi

      - name: Delete Container App
        if: steps.check_app.outputs.app_exists == 'true'
        run: |
          set +e
          APP_NAME="${{ inputs.container_app_name }}"
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          
          echo "Deleting Azure Container App: $APP_NAME in resource group: $RESOURCE_GROUP"
          
          # Delete the container app
          delete_output=$(az containerapp delete \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --yes 2>&1)
          
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "Container app deleted successfully"
            
            cat > output/result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "success",
            "container_app_name": "$APP_NAME",
            "operation": "delete",
            "resource_group": "$RESOURCE_GROUP",
            "deleted_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "error": null,
            "message": "Container app '$APP_NAME' has been successfully deleted"
          }
          EOF
          else
            echo "Failed to delete container app: $delete_output"
            
            cat > output/result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "container_app_name": "$APP_NAME",
            "operation": "delete",
            "resource_group": "$RESOURCE_GROUP",
            "error": "Failed to delete container app",
            "message": "Deletion failed: $delete_output"
          }
          EOF
          fi

      - name: Create metadata JSON
        if: always()
        run: |
          APP_NAME="${{ inputs.container_app_name }}"
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          
          # Get status from result.json
          STATUS=$(jq -r '.status' output/result.json 2>/dev/null || echo "unknown")
          
          cat > output/tool-${APP_NAME}.json << EOF
          {
            "tool-id": "${APP_NAME}",
            "name": "$APP_NAME",
            "resource-group": "$RESOURCE_GROUP",
            "container-app-name": "$APP_NAME",
            "sha": "${{ github.sha }}",
            "run-id": "${{ github.run_id }}",
            "status": "$STATUS",
            "operation": "delete",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Display Results
        if: always()
        run: |
          echo "=== Deletion Result ==="
          if [ -f output/result.json ]; then
            cat output/result.json | jq . || cat output/result.json
          fi
          
          echo "=== Metadata ==="
          if [ -f output/tool-${{ inputs.container_app_name }}.json ]; then
            cat output/tool-${{ inputs.container_app_name }}.json | jq . || cat output/tool-${{ inputs.container_app_name }}.json
          fi

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delete-result-${{ inputs.container_app_name }}
          path: output/result.json

      - name: Upload metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-${{ inputs.container_app_name }}
          path: output/tool-${{ inputs.container_app_name }}.json
