name: Update Azure Container App Credentials

on:
  workflow_dispatch:
   inputs:
    container_app_name:
      description: 'Name of the Azure Container App to update'
      required: true
    unique_id:
      description: 'Unique identifier for tracking'
      required: true
    config_type:
      description: 'Type of configuration'
      required: true
    key_name:
      description: 'Name of the key to update'
      required: true
    key_value:
      description: 'Value to set'
      required: true
    is_secret:
      description: 'Whether this is a secret value'
      required: true

jobs:
  update-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Initialize Result JSON
        run: |
          mkdir -p output
          cat > output/result_${{ inputs.unique_id }}.json << 'EOF'
          {
            "run_id": "${{ github.run_id }}",
            "status": "running",
            "container_app_name": "${{ inputs.container_app_name }}",
            "unique_id": "${{ inputs.unique_id }}",
            "operation": "update_${{ inputs.config_type }}",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "updated_at": null,
            "updated_key": "${{ inputs.key_name }}",
            "error": null,
            "message": "Starting container app configuration update process"
          }
          EOF

      - name: Update Container App Configuration
        run: |
          set +e
          APP_NAME="${{ inputs.container_app_name }}"
          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          UNIQUE_ID="${{ inputs.unique_id }}"
          CONFIG_TYPE="${{ inputs.config_type }}"
          KEY_NAME="${{ inputs.key_name }}"
          KEY_VALUE="${{ inputs.key_value }}"
          IS_SECRET="${{ inputs.is_secret }}"
          
          echo "Updating Azure Container App: $APP_NAME in resource group: $RESOURCE_GROUP"
          echo "Configuration Type: $CONFIG_TYPE"
          echo "Key: $KEY_NAME"
          echo "Is Secret: $IS_SECRET"
          
          # Mask sensitive values in logs
          echo "::add-mask::$KEY_VALUE"
          
          # Update Azure CLI to latest version
          az upgrade --yes --all
          
          if [ "$CONFIG_TYPE" = "environment" ]; then
            if [ "$IS_SECRET" = "true" ]; then
              # First create/update the secret
              SECRET_CMD="az containerapp secret set --name $APP_NAME --resource-group $RESOURCE_GROUP --secrets $KEY_NAME=$KEY_VALUE"
              echo "Executing: $SECRET_CMD"
              secret_output=$(eval "$SECRET_CMD" 2>&1)
              
              # Then reference the secret in environment variables
              ENV_CMD="az containerapp update --name $APP_NAME --resource-group $RESOURCE_GROUP --set-env-vars $KEY_NAME=secretref:$KEY_NAME"
              echo "Executing: $ENV_CMD"
              update_output=$(eval "$ENV_CMD" 2>&1)
            else
              # Regular environment variable
              ENV_CMD="az containerapp update --name $APP_NAME --resource-group $RESOURCE_GROUP --set-env-vars $KEY_NAME=$KEY_VALUE"
              echo "Executing: $ENV_CMD"
              update_output=$(eval "$ENV_CMD" 2>&1)
            fi
          elif [ "$CONFIG_TYPE" = "secrets" ]; then
            # Just update the secret
            SECRET_CMD="az containerapp secret set --name $APP_NAME --resource-group $RESOURCE_GROUP --secrets $KEY_NAME=$KEY_VALUE"
            echo "Executing: $SECRET_CMD"
            update_output=$(eval "$SECRET_CMD" 2>&1)
          else
            echo "Invalid config type: $CONFIG_TYPE"
            exit 1
          fi
          
          EXIT_CODE=$?
    
          # Rest of your existing result handling...
          
          echo "Executing: $UPDATE_CMD"
          update_output=$(eval "$UPDATE_CMD" 2>&1)
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "Container app updated successfully"
            
            cat > output/result_$UNIQUE_ID.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "success",
            "container_app_name": "$APP_NAME",
            "unique_id": "$UNIQUE_ID",
            "operation": "update_$CONFIG_TYPE",
            "resource_group": "$RESOURCE_GROUP",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "updated_key": "$KEY_NAME",
            "error": null,
            "message": "Container app '$APP_NAME' has been successfully updated"
          }
          EOF
          else
            echo "Failed to update container app: $update_output"
            
            cat > output/result_$UNIQUE_ID.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "container_app_name": "$APP_NAME",
            "unique_id": "$UNIQUE_ID",
            "operation": "update_$CONFIG_TYPE",
            "resource_group": "$RESOURCE_GROUP",
            "updated_at": null,
            "updated_key": "$KEY_NAME",
            "error": "Failed to update container app",
            "message": "Update failed: $update_output"
          }
          EOF
          fi

      - name: Display Results
        if: always()
        run: |
          echo "=== Update Result ==="
          if [ -f output/result_${{ inputs.unique_id }}.json ]; then
            cat output/result_${{ inputs.unique_id }}.json | jq . || cat output/result_${{ inputs.unique_id }}.json
          fi

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "result_${{ inputs.unique_id }}"
          path: "output/result_${{ inputs.unique_id }}.json"
