name: Stop Azure Container App by Deactivating Revisions

on:
  workflow_dispatch:
    inputs:
      container_app_name:
        description: 'Name of the Container App to stop'
        required: true
        type: string
      resource_group:
        description: 'Azure Resource Group'
        required: true
        type: string
      subscription_id:
        description: 'Azure Subscription ID'
        required: true
        type: string

jobs:
  stop:
    runs-on: ubuntu-latest
    outputs:
      revisions: ${{ steps.get_revisions.outputs.revisions }}
    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Active Revisions
        id: get_revisions
        run: |
          set +e
          revisions=$(az containerapp revision list \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ github.event.inputs.resource_group }}" \
            --query "[?properties.active].name" \
            -o tsv)
          
          echo "Found revisions: $revisions"
          echo "revisions=$revisions" >> $GITHUB_OUTPUT
          echo "$revisions" > revisions.txt

      - name: Deactivate Revisions
        if: steps.get_revisions.outputs.revisions != ''
        run: |
          for rev in ${{ steps.get_revisions.outputs.revisions }}; do
            echo "Deactivating revision: $rev"
            az containerapp revision deactivate \
              --name "${{ github.event.inputs.container_app_name }}" \
              --resource-group "${{ github.event.inputs.resource_group }}" \
              --revision "$rev" > deactivate_$rev.log 2>&1
            STATUS=$?
            if [ $STATUS -ne 0 ]; then
              echo "Failed to deactivate revision $rev"
              cat deactivate_$rev.log
              echo "failure" > result.txt
              exit 1
            fi
          done
          echo "success" > result.txt

      - name: Handle Already Stopped Case
        if: steps.get_revisions.outputs.revisions == ''
        run: |
          echo "App was already stopped - no revisions to deactivate"
          echo "success" > result.txt

      - name: Ensure result.txt exists
        if: always()
        run: |
          if [ ! -f result.txt ]; then
            echo "Result file missing, writing unknown status."
            echo "unknown" > result.txt
          fi

      - name: Upload Result Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop-result-${{ github.event.inputs.container_app_name }}
          path: result.txt

      - name: Upload Revision List
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop-revisions-${{ github.event.inputs.container_app_name }}
          path: revisions.txt

      - name: Upload Deactivation Logs
        if: steps.get_revisions.outputs.revisions != ''
        uses: actions/upload-artifact@v4
        with:
          name: stop-logs-${{ github.event.inputs.container_app_name }}
          path: deactivate_*.log
