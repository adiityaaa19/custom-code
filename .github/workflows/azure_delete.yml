name: Delete Azure Container App

on:
  workflow_dispatch:
    inputs:
      container_app_name:
        description: 'Name of the Container App to delete'
        required: true
        type: string

jobs:
  delete:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ github.run_id }}
      status: ${{ steps.final_status.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Initialize Result JSON
        run: |
          cat > result.json << 'EOF'
          {
            "run_id": "${{ github.run_id }}",
            "status": "running",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "operation": "delete",
            "error": null,
            "message": "Starting container app deletion process"
          }
          EOF

      - name: Check Container App Exists
        id: check_app
        run: |
          set +e
          echo "Checking if container app exists..."
          
          app_name=$(az containerapp show \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "name" \
            -o tsv 2>&1)
          
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Container app not found: $app_name"
            echo "app_exists=false" >> $GITHUB_OUTPUT
            
            cat > result.json << 'EOF'
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "operation": "delete",
            "error": "Container app not found",
            "message": "Container app '${{ github.event.inputs.container_app_name }}' does not exist"
          }
          EOF
          else
            echo "Container app found: $app_name"
            echo "app_exists=true" >> $GITHUB_OUTPUT
            
            cat > result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "processing",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "operation": "delete",
            "error": null,
            "message": "Container app found, proceeding with deletion"
          }
          EOF
          fi

      - name: Delete Container App
        id: delete_app
        if: steps.check_app.outputs.app_exists == 'true'
        run: |
          set +e
          echo "Deleting container app: ${{ github.event.inputs.container_app_name }}"
          
          delete_output=$(az containerapp delete \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --yes \
            2>&1)
          
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "Container app deleted successfully"
            echo "delete_success=true" >> $GITHUB_OUTPUT
            
            cat > result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "success",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "operation": "delete",
            "deleted_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "error": null,
            "message": "Container app '${{ github.event.inputs.container_app_name }}' has been successfully deleted"
          }
          EOF
          else
            echo "Failed to delete container app: $delete_output"
            echo "delete_success=false" >> $GITHUB_OUTPUT
            
            cat > result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "operation": "delete",
            "error": "Failed to delete container app",
            "message": "Deletion failed: $delete_output"
          }
          EOF
          fi

      - name: Set Final Status
        id: final_status
        if: always()
        run: |
          if [ -f result.json ]; then
            status=$(jq -r '.status' result.json 2>/dev/null || echo "unknown")
            echo "Final workflow status: $status"
            echo "status=$status" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Display Final Result
        if: always()
        run: |
          echo "=== Final Deletion Result ==="
          if [ -f result.json ]; then
            jq -C . result.json || cat result.json
          else
            echo "No result.json file found"
          fi

      - name: Upload Result Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delete-result-${{ github.event.inputs.container_app_name }}
          path: result.json

      - name: Create Summary
        if: always()
        run: |
          if [ -f result.json ]; then
            cp result.json summary.json
          else
            echo '{"error": "No result generated"}' > summary.json
          fi

      - name: Upload Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delete-summary-${{ github.event.inputs.container_app_name }}
          path: summary.json
