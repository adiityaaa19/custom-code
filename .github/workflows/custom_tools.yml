name: Deploy Tool to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      tool_id:
        description: "Deployment ID (unique container/image name, e.g. toolid_userid_xxx)"
        required: true
      unique_id:
        description: "Unique identifier for tracking this workflow run"
        required: true
      tool_dir:
        description: "Path to tool directory (e.g. tools_studio/tool-id)"
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      tool_id: ${{ github.event.inputs.tool_id }}
      UNIQUE_ID: ${{ github.event.inputs.unique_id }}
      TOOL_DIR: ${{ github.event.inputs.tool_dir }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Initialize Result JSON
        run: |
          mkdir -p output
          cat > output/result_${{ env.UNIQUE_ID }}.json << 'EOF'
          {
            "run_id": "${{ github.run_id }}",
            "status": "running",
            "tool_id": "${{ env.tool_id }}",
            "unique_id": "${{ env.UNIQUE_ID }}",
            "tool_dir": "${{ env.TOOL_DIR }}",
            "operation": "deploy",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "completed_at": null,
            "endpoint": null,
            "error": null,
            "message": "Starting deployment process"
          }
          EOF

      - name: Validate deployment ID format
        run: |
          if ! [[ "$tool_id" =~ ^[a-z0-9-]{1,32}$ ]]; then
            echo "::error::Invalid tool_id format. Must be lowercase alphanumeric with hyphens, max 32 chars."
            cat > output/result_${{ env.UNIQUE_ID }}.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "tool_id": "${{ env.tool_id }}",
            "unique_id": "${{ env.UNIQUE_ID }}",
            "tool_dir": "${{ env.TOOL_DIR }}",
            "operation": "deploy",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "endpoint": null,
            "error": "Invalid tool_id format",
            "message": "Invalid tool_id format. Must be lowercase alphanumeric with hyphens, max 32 chars."
          }
          EOF
            exit 1
          fi

      - name: Verify tool directory exists
        run: |
          if [ ! -d "$TOOL_DIR" ]; then
            echo "::error::Tool directory '$TOOL_DIR' not found"
            cat > output/result_${{ env.UNIQUE_ID }}.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "tool_id": "${{ env.tool_id }}",
            "unique_id": "${{ env.UNIQUE_ID }}",
            "tool_dir": "${{ env.TOOL_DIR }}",
            "operation": "deploy",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "endpoint": null,
            "error": "Tool directory not found",
            "message": "Tool directory '$TOOL_DIR' not found"
          }
          EOF
            exit 1
          fi

          if [ ! -f "$TOOL_DIR/Dockerfile" ]; then
            echo "::error::Dockerfile not found in $TOOL_DIR"
            cat > output/result_${{ env.UNIQUE_ID }}.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "tool_id": "${{ env.tool_id }}",
            "unique_id": "${{ env.UNIQUE_ID }}",
            "tool_dir": "${{ env.TOOL_DIR }}",
            "operation": "deploy",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "endpoint": null,
            "error": "Dockerfile not found",
            "message": "Dockerfile not found in $TOOL_DIR"
          }
          EOF
            exit 1
          fi

      - name: Set deployment metadata
        id: metadata
        run: |
          echo "tool_id=${tool_id}" >> $GITHUB_ENV
          echo "tool_id=${tool_id}" >> $GITHUB_OUTPUT
          echo "UNIQUE_ID=${UNIQUE_ID}" >> $GITHUB_ENV
          echo "unique_id=${UNIQUE_ID}" >> $GITHUB_OUTPUT
          echo "TOOL_DIR=${TOOL_DIR}" >> $GITHUB_ENV
          echo "tool_dir=${TOOL_DIR}" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Image
        run: |
          echo "Building Docker image from $TOOL_DIR..."
          docker build -t ${{ secrets.AZURE_CONTAINER_REGISTRY }}/$tool_id:latest $TOOL_DIR
          echo ${{ secrets.AZURE_ACR_PASSWORD }} | docker login ${{ secrets.AZURE_CONTAINER_REGISTRY }} -u ${{ secrets.AZURE_ACR_USERNAME }} --password-stdin
          docker push ${{ secrets.AZURE_CONTAINER_REGISTRY }}/$tool_id:latest

          cat > output/result_${{ env.UNIQUE_ID }}.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "processing",
            "tool_id": "${{ env.tool_id }}",
            "unique_id": "${{ env.UNIQUE_ID }}",
            "tool_dir": "${{ env.TOOL_DIR }}",
            "operation": "deploy",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "completed_at": null,
            "endpoint": null,
            "error": null,
            "message": "Docker image built and pushed successfully"
          }
          EOF

      - name: Deploy or Update Azure Container App
        id: deploy
        run: |
          set -e
          echo "Checking for existing container app..."
          EXISTING_APP=$(az containerapp show --name $tool_id --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query name -o tsv || echo "")

          if [ -z "$EXISTING_APP" ]; then
            echo "Creating new container app..."
            az containerapp create \
              --name $tool_id \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/$tool_id:latest \
              --environment ${{ secrets.AZURE_CONTAINERAPPS_ENVIRONMENT }} \
              --ingress external --target-port 8000 \
              --registry-server ${{ secrets.AZURE_CONTAINER_REGISTRY }} \
              --registry-username ${{ secrets.AZURE_ACR_USERNAME }} \
              --registry-password ${{ secrets.AZURE_ACR_PASSWORD }}
          else
            echo "Updating existing container app..."
            az containerapp update \
              --name $tool_id \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/$tool_id:latest
          fi

          echo "Retrieving application URL..."
          APP_URL=$(az containerapp show --name $tool_id --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "DEPLOYED_URL=https://$APP_URL/sse" >> $GITHUB_ENV
          echo "DEPLOYED_URL=https://$APP_URL/sse" >> $GITHUB_OUTPUT

          cat > output/result_${{ env.UNIQUE_ID }}.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "success",
            "tool_id": "${{ env.tool_id }}",
            "unique_id": "${{ env.UNIQUE_ID }}",
            "tool_dir": "${{ env.TOOL_DIR }}",
            "operation": "deploy",
            "resource_group": "${{ secrets.AZURE_RESOURCE_GROUP }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "endpoint": "https://$APP_URL/sse",
            "error": null,
            "message": "Deployment completed successfully"
          }
          EOF

      - name: Display Results
        if: always()
        run: |
          echo "=== Deployment Result ==="
          if [ -f output/result_${{ env.UNIQUE_ID }}.json ]; then
            cat output/result_${{ env.UNIQUE_ID }}.json | jq . || cat output/result_${{ env.UNIQUE_ID }}.json
          fi

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "result_${{ env.UNIQUE_ID }}"
          path: "output/result_${{ env.UNIQUE_ID }}.json"
