name: Restart Azure Container App

on:
  workflow_dispatch:
    inputs:
      container_app_name:
        description: 'Name of the Azure Container App'
        required: true
      unique_id:
        description: 'Unique identifier for tracking'
        required: true

jobs:
  restart:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart active revision
        run: |
          # Retrieve the active revision name
          REVISION_NAME=$(az containerapp revision list \
            --name ${{ github.event.inputs.container_app_name }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "[?properties.active==\`true\`].name" \
            --output tsv)

          echo "Active revision: $REVISION_NAME"

          # Restart the active revision
          az containerapp revision restart \
            --name ${{ github.event.inputs.container_app_name }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision $REVISION_NAME

      - name: Upload result artifact
        run: |
          mkdir -p artifacts
          echo "{\"container_app_name\": \"${{ github.event.inputs.container_app_name }}\", \"status\": \"restarted\"}" > artifacts/result_${{ github.event.inputs.unique_id }}.json
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: result_${{ github.event.inputs.unique_id }}
          path: artifacts/result_${{ github.event.inputs.unique_id }}.json
