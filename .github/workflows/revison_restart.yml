name: Start Azure Container App with Fresh Replicas

on:
  workflow_dispatch:
    inputs:
      container_app_name:
        description: 'Name of the Container App to start'
        required: true
        type: string
      revision_name:
        description: 'Optional: Specific revision to activate. If not provided, will create fresh replicas.'
        required: false
        type: string

jobs:
  start:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ github.run_id }}
      status: ${{ steps.final_status.outputs.status }}
    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Initialize Result JSON
        run: |
          cat > result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "running",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "revision": null,
            "activation_method": "",
            "error": null,
            "message": "Starting container app activation process"
          }
          EOF

      - name: Check Container App Exists
        id: check_app
        run: |
          set +e
          app_check=$(az containerapp show \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "name" \
            -o tsv 2>&1)
          
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Container app not found"
            echo "status=failed" >> $GITHUB_OUTPUT
            jq --arg error "Container app '${{ github.event.inputs.container_app_name }}' not found" \
              '.status = "failed" | .error = $error | .message = "Container app does not exist"' \
              result.json > tmp.json && mv tmp.json result.json
            exit 1
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Try to Activate Existing Revision (if specified)
        id: activate_existing
        if: github.event.inputs.revision_name != ''
        run: |
          set +e
          revision="${{ github.event.inputs.revision_name }}"
          
          echo "Attempting to activate specified revision: $revision"
          activate_output=$(az containerapp revision activate \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --revision "$revision" 2>&1)
          
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "Activation successful!"
            echo "method=existing_revision" >> $GITHUB_OUTPUT
            echo "revision=$revision" >> $GITHUB_OUTPUT
            jq --arg rev "$revision" --arg method "existing_revision" \
              '.revision = $rev | .activation_method = $method | .status = "success" | .message = "Specified revision successfully activated"' \
              result.json > tmp.json && mv tmp.json result.json
          else
            echo "::warning::Failed to activate specified revision, will create fresh replicas"
            echo "method=fresh_replicas" >> $GITHUB_OUTPUT
            jq --arg error "$activate_output" \
              '.activation_method = "fresh_replicas" | .error = $error | .message = "Failed to activate specified revision, will create fresh replicas"' \
              result.json > tmp.json && mv tmp.json result.json
          fi

      - name: Create Fresh Replicas
        id: create_fresh
        if: github.event.inputs.revision_name == '' || steps.activate_existing.outcome != 'success'
        run: |
          set +e
          echo "Creating fresh replicas by restarting the container app..."
          
          # Restart the entire container app to create fresh replicas
          restart_output=$(az containerapp restart \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" 2>&1)
          
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Failed to create fresh replicas"
            jq --arg error "$restart_output" \
              '.status = "failed" | .error = $error | .message = "Failed to create fresh replicas"' \
              result.json > tmp.json && mv tmp.json result.json
            exit $EXIT_CODE
          else
            echo "Fresh replicas created successfully!"
            
            # Get the latest revision after restart
            latest_revision=$(az containerapp revision list \
              --name "${{ github.event.inputs.container_app_name }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --query "sort_by([], &properties.createdTime) | [-1].name" \
              -o tsv)
            
            echo "method=fresh_replicas" >> $GITHUB_OUTPUT
            echo "revision=$latest_revision" >> $GITHUB_OUTPUT
            jq --arg rev "$latest_revision" --arg method "fresh_replicas" \
              '.revision = $rev | .activation_method = $method | .status = "success" | .message = "Fresh replicas successfully created"' \
              result.json > tmp.json && mv tmp.json result.json
          fi

      - name: Verify Replicas Running
        id: verify_replicas
        if: steps.activate_existing.outcome == 'success' || steps.create_fresh.outcome == 'success'
        run: |
          set +e
          revision="${{ steps.activate_existing.outputs.revision || steps.create_fresh.outputs.revision }}"
          
          echo "Checking replicas for revision: $revision"
          replica_status=$(az containerapp revision show \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --revision "$revision" \
            --query "properties.replicas" \
            -o json)
          
          if [ "$(echo "$replica_status" | jq 'length')" -gt 0 ]; then
            echo "Replicas are running successfully"
            jq --argjson replicas "$replica_status" \
              '.replica_status = $replicas | .message = "Replicas running successfully"' \
              result.json > tmp.json && mv tmp.json result.json
          else
            echo "::warning::No replicas found after activation"
            jq --argjson replicas "$replica_status" \
              '.replica_status = $replicas | .message = "No replicas found after activation attempt"' \
              result.json > tmp.json && mv tmp.json result.json
          fi

      - name: Set Final Status
        id: final_status
        if: always()
        run: |
          if [ -f result.json ]; then
            status=$(jq -r '.status' result.json)
            echo "status=$status" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Upload Result Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-result-${{ github.event.inputs.container_app_name }}
          path: result.json

      - name: Display Final Result
        if: always()
        run: |
          echo "=== Activation Result ==="
          cat result.json
