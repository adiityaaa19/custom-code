name: Restart Azure Container App

on:
  workflow_dispatch:
    inputs:
      container_app_name:
        description: 'Name of the Container App to restart'
        required: true
        type: string
      restart_method:
        description: 'Restart method'
        required: false
        default: 'create_revision'
        type: choice
        options:
          - 'create_revision'
          - 'update_replicas'
          - 'force_restart'

jobs:
  restart:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ github.run_id }}
      status: ${{ steps.final_status.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Initialize Result JSON
        run: |
          cat > result.json << 'EOF'
          {
            "run_id": "${{ github.run_id }}",
            "status": "running",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "restart_method": "${{ github.event.inputs.restart_method }}",
            "revisions": [],
            "error": null,
            "message": "Starting container app restart process"
          }
          EOF

      - name: Check Container App Exists
        id: check_app
        run: |
          set +e
          echo "Checking if container app exists..."
          
          # Simple check - just get the name to verify existence
          app_name=$(az containerapp show \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "name" \
            -o tsv 2>&1)
          
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Container app not found or error occurred: $app_name"
            echo "app_exists=false" >> $GITHUB_OUTPUT
            echo "error_message=Container app '${{ github.event.inputs.container_app_name }}' not found" >> $GITHUB_OUTPUT
            
            cat > result.json << 'EOF'
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "restart_method": "${{ github.event.inputs.restart_method }}",
            "revisions": [],
            "error": "Container app not found",
            "message": "Container app '${{ github.event.inputs.container_app_name }}' does not exist"
          }
          EOF
          else
            echo "Container app found: $app_name"
            echo "app_exists=true" >> $GITHUB_OUTPUT
            
            # Get additional status info separately
            provisioning_state=$(az containerapp show \
              --name "${{ github.event.inputs.container_app_name }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --query "properties.provisioningState" \
              -o tsv 2>/dev/null || echo "Unknown")
            
            running_status=$(az containerapp show \
              --name "${{ github.event.inputs.container_app_name }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --query "properties.runningStatus" \
              -o tsv 2>/dev/null || echo "Unknown")
            
            echo "provisioning_state=$provisioning_state" >> $GITHUB_OUTPUT
            echo "running_status=$running_status" >> $GITHUB_OUTPUT
            
            cat > result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "processing",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "restart_method": "${{ github.event.inputs.restart_method }}",
            "app_status": {
              "provisioning_state": "$provisioning_state",
              "running_status": "$running_status"
            },
            "revisions": [],
            "error": null,
            "message": "Container app found, proceeding with restart"
          }
          EOF
          fi

      - name: Get Current Revisions
        id: get_revisions
        if: steps.check_app.outputs.app_exists == 'true'
        run: |
          set +e
          echo "Getting current revisions..."
          
          # Get all revisions with their status
          all_revisions=$(az containerapp revision list \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "[].{name: name, active: properties.active, createdTime: properties.createdTime, replicas: properties.replicas}" \
            -o json 2>&1)

          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Failed to get revisions: $all_revisions"
            echo "revisions_retrieved=false" >> $GITHUB_OUTPUT
          else
            echo "Retrieved revisions successfully"
            echo "revisions_retrieved=true" >> $GITHUB_OUTPUT
            
            # Count active and inactive revisions
            active_count=$(echo "$all_revisions" | jq '[.[] | select(.active == true)] | length')
            inactive_count=$(echo "$all_revisions" | jq '[.[] | select(.active == false)] | length')
            total_count=$(echo "$all_revisions" | jq 'length')
            
            echo "active_revisions=$active_count" >> $GITHUB_OUTPUT
            echo "inactive_revisions=$inactive_count" >> $GITHUB_OUTPUT
            echo "total_revisions=$total_count" >> $GITHUB_OUTPUT
            
            # Get active revision names
            active_revision_names=$(echo "$all_revisions" | jq -r '[.[] | select(.active == true).name] | join(" ")')
            echo "active_revision_names=$active_revision_names" >> $GITHUB_OUTPUT
            
            echo "Active revisions: $active_count, Inactive: $inactive_count, Total: $total_count"
          fi

      - name: Method 1 - Create New Revision (Recommended)
        id: create_revision
        if: steps.check_app.outputs.app_exists == 'true' && github.event.inputs.restart_method == 'create_revision'
        run: |
          set +e
          echo "Creating new revision to restart the container app..."
          
          # Get current container app configuration
          current_config=$(az containerapp show \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "properties.template" \
            -o json)
          
          # Create a new revision by updating with a timestamp annotation
          timestamp=$(date +%s)
          
          update_result=$(az containerapp update \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --set-env-vars "RESTART_TIMESTAMP=$timestamp" \
            --query "properties.latestRevisionName" \
            -o tsv 2>&1)
          
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "Successfully created new revision: $update_result"
            echo "new_revision=$update_result" >> $GITHUB_OUTPUT
            echo "restart_success=true" >> $GITHUB_OUTPUT
            
            # Wait a moment for the revision to be ready
            sleep 30
            
            # Verify the new revision is active
            new_revision_status=$(az containerapp revision show \
              --name "${{ github.event.inputs.container_app_name }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --revision "$update_result" \
              --query "properties.active" \
              -o tsv 2>/dev/null)
            
            if [ "$new_revision_status" = "true" ]; then
              final_status="success"
              message="Successfully restarted container app with new revision: $update_result"
            else
              final_status="partial_success"
              message="New revision created but may not be fully active yet: $update_result"
            fi
            
            cat > result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "$final_status",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "restart_method": "create_revision",
            "new_revision": "$update_result",
            "revisions": ["$update_result"],
            "error": null,
            "message": "$message"
          }
          EOF
          else
            echo "Failed to create new revision: $update_result"
            echo "restart_success=false" >> $GITHUB_OUTPUT
            
            cat > result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "restart_method": "create_revision",
            "revisions": [],
            "error": "Failed to create new revision: $update_result",
            "message": "Could not restart container app by creating new revision"
          }
          EOF
          fi

      - name: Method 2 - Update Replica Count
        id: update_replicas
        if: steps.check_app.outputs.app_exists == 'true' && github.event.inputs.restart_method == 'update_replicas'
        run: |
          set +e
          echo "Restarting by updating replica count..."
          
          # Get current replica configuration
          current_replicas=$(az containerapp show \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "properties.template.scale" \
            -o json)
          
          min_replicas=$(echo "$current_replicas" | jq -r '.minReplicas // 0')
          max_replicas=$(echo "$current_replicas" | jq -r '.maxReplicas // 10')
          
          echo "Current replica range: $min_replicas - $max_replicas"
          
          # First scale down to 0 (if possible)
          if [ "$min_replicas" -gt 0 ]; then
            echo "Setting min replicas to 0..."
            az containerapp update \
              --name "${{ github.event.inputs.container_app_name }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --min-replicas 0 \
              --max-replicas $max_replicas
            
            sleep 30
          fi
          
          # Then scale back up
          echo "Scaling back up..."
          scale_result=$(az containerapp update \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --min-replicas $([ "$min_replicas" -eq 0 ] && echo 1 || echo $min_replicas) \
            --max-replicas $max_replicas \
            --query "properties.latestRevisionName" \
            -o tsv 2>&1)
          
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "Successfully restarted by updating replicas"
            echo "restart_success=true" >> $GITHUB_OUTPUT
            
            cat > result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "success",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "restart_method": "update_replicas",
            "latest_revision": "$scale_result",
            "revisions": ["$scale_result"],
            "replica_config": {
              "min_replicas": $([ "$min_replicas" -eq 0 ] && echo 1 || echo $min_replicas),
              "max_replicas": $max_replicas
            },
            "error": null,
            "message": "Successfully restarted container app by updating replica count"
          }
          EOF
          else
            echo "Failed to restart by updating replicas: $scale_result"
            echo "restart_success=false" >> $GITHUB_OUTPUT
            
            cat > result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "restart_method": "update_replicas",
            "revisions": [],
            "error": "Failed to update replicas: $scale_result",
            "message": "Could not restart container app by updating replica count"
          }
          EOF
          fi

      - name: Method 3 - Force Restart
        id: force_restart
        if: steps.check_app.outputs.app_exists == 'true' && github.event.inputs.restart_method == 'force_restart'
        run: |
          set +e
          echo "Performing force restart..."
          
          # This method combines deactivating current revisions and creating a new one
          active_revisions="${{ steps.get_revisions.outputs.active_revision_names }}"
          
          if [ -n "$active_revisions" ]; then
            echo "Deactivating current active revisions: $active_revisions"
            for rev in $active_revisions; do
              echo "Deactivating: $rev"
              az containerapp revision deactivate \
                --name "${{ github.event.inputs.container_app_name }}" \
                --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
                --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
                --revision "$rev"
            done
            
            sleep 10
          fi
          
          # Create new revision
          timestamp=$(date +%s)
          new_revision_result=$(az containerapp update \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --set-env-vars "FORCE_RESTART_TIMESTAMP=$timestamp" \
            --query "properties.latestRevisionName" \
            -o tsv 2>&1)
          
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "Successfully performed force restart"
            echo "restart_success=true" >> $GITHUB_OUTPUT
            
            cat > result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "success",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "restart_method": "force_restart",
            "new_revision": "$new_revision_result",
            "deactivated_revisions": "$active_revisions",
            "revisions": ["$new_revision_result"],
            "error": null,
            "message": "Successfully performed force restart with new revision: $new_revision_result"
          }
          EOF
          else
            echo "Failed to perform force restart: $new_revision_result"
            echo "restart_success=false" >> $GITHUB_OUTPUT
            
            cat > result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "restart_method": "force_restart",
            "revisions": [],
            "error": "Failed to perform force restart: $new_revision_result",
            "message": "Could not perform force restart"
          }
          EOF
          fi

      - name: Verify Restart Success
        if: steps.check_app.outputs.app_exists == 'true'
        run: |
          echo "Verifying restart success..."
          sleep 15
          
          # Check current status
          final_status=$(az containerapp show \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "{provisioningState: properties.provisioningState, runningStatus: properties.runningStatus, latestRevision: properties.latestRevisionName}" \
            -o json)
          
          echo "Final container app status:"
          echo "$final_status" | jq '.'
          
          # Update result with final status
          if [ -f result.json ]; then
            current_result=$(cat result.json)
            echo "$current_result" | jq --argjson final_status "$final_status" '. + {"final_app_status": $final_status}' > result.json
          fi

      - name: Set Final Status
        id: final_status
        if: always()
        run: |
          if [ -f result.json ]; then
            status=$(jq -r '.status' result.json)
            echo "Final workflow status: $status"
            echo "status=$status" >> $GITHUB_OUTPUT
          else
            echo "No result.json found, creating error result"
            cat > result.json << 'EOF'
          {
            "run_id": "${{ github.run_id }}",
            "status": "failed",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "restart_method": "${{ github.event.inputs.restart_method }}",
            "revisions": [],
            "error": "Workflow completed but no result was generated",
            "message": "Unknown error occurred during processing"
          }
          EOF
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Display Final Result
        if: always()
        run: |
          echo "=== Final Restart Result ==="
          if [ -f result.json ]; then
            cat result.json | jq '.'
          else
            echo "No result.json file found"
          fi

      - name: Upload Result Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restart-result-${{ github.event.inputs.container_app_name }}
          path: result.json

      - name: Upload Summary Artifact
        if: always()
        run: |
          if [ -f result.json ]; then
            cp result.json summary.json
          else
            echo '{"error": "No result generated"}' > summary.json
          fi

      - name: Upload Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restart-summary-${{ github.event.inputs.container_app_name }}
          path: summary.json
