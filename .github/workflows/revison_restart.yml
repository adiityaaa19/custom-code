
name: Start Azure Container App by Activating Revision

on:
  workflow_dispatch:
    inputs:
      container_app_name:
        description: 'Name of the Container App to start'
        required: true
        type: string
      revision_name:
        description: 'Optional: Specific revision to activate. If not provided, the latest inactive revision will be activated.'
        required: false
        type: string

jobs:
  start:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ github.run_id }}
      status: ${{ steps.final_status.outputs.status }}
    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Initialize Result JSON
        run: |
          cat > result.json << EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "running",
            "container_app_name": "${{ github.event.inputs.container_app_name }}",
            "revision": null,
            "activation_method": "",
            "error": null,
            "message": "Starting container app activation process"
          }
          EOF

      - name: Check Container App Exists
        id: check_app
        run: |
          set +e
          app_check=$(az containerapp show \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "name" \
            -o tsv 2>&1)
          
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Container app not found"
            echo "status=failed" >> $GITHUB_OUTPUT
            jq --arg error "Container app '${{ github.event.inputs.container_app_name }}' not found" \
              '.status = "failed" | .error = $error | .message = "Container app does not exist"' \
              result.json > tmp.json && mv tmp.json result.json
            exit 1
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Determine Revision to Activate
        id: determine_revision
        run: |
          # If revision name is provided, use it
          if [ -n "${{ github.event.inputs.revision_name }}" ]; then
            revision="${{ github.event.inputs.revision_name }}"
            method="user_specified"
            echo "Using user-specified revision: $revision"
          else
            echo "Finding latest inactive revision..."
            revision=$(az containerapp revision list \
              --name "${{ github.event.inputs.container_app_name }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --query "[?properties.active==\`false\`] | sort_by([], &properties.createdTime) | [-1].name" \
              -o tsv)
            
            if [ -z "$revision" ]; then
              echo "::error::No inactive revisions found"
              jq --arg error "No inactive revisions available" \
                '.status = "failed" | .error = $error | .message = "No revisions to activate"' \
                result.json > tmp.json && mv tmp.json result.json
              exit 1
            fi
            method="latest_inactive"
            echo "Selected latest inactive revision: $revision"
          fi

          echo "revision=$revision" >> $GITHUB_OUTPUT
          echo "method=$method" >> $GITHUB_OUTPUT

          # Update result.json
          jq --arg rev "$revision" --arg method "$method" \
            '.revision = $rev | .activation_method = $method | .message = "Revision selected for activation"' \
            result.json > tmp.json && mv tmp.json result.json

      - name: Activate Revision
        id: activate_revision
        run: |
          set +e
          revision="${{ steps.determine_revision.outputs.revision }}"
          
          echo "Activating revision: $revision"
          activate_output=$(az containerapp revision activate \
            --name "${{ github.event.inputs.container_app_name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --revision "$revision" 2>&1)
          
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Activation failed"
            jq --arg error "$activate_output" \
              '.status = "failed" | .error = $error | .message = "Revision activation failed"' \
              result.json > tmp.json && mv tmp.json result.json
            exit $EXIT_CODE
          else
            echo "Activation successful!"
            jq '.status = "success" | .message = "Revision successfully activated"' \
              result.json > tmp.json && mv tmp.json result.json
          fi

      - name: Set Final Status
        id: final_status
        if: always()
        run: |
          if [ -f result.json ]; then
            status=$(jq -r '.status' result.json)
            echo "status=$status" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Upload Result Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-result-${{ github.event.inputs.container_app_name }}
          path: result.json

      - name: Display Final Result
        if: always()
        run: |
          echo "=== Activation Result ==="
          cat result.json
