name: Deploy Tool to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      tool_dir:
        description: "Path to tool directory (e.g. tools/tool-id)"
        required: true
      credentials:
        description: "JSON string of credentials to pass to container"
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      TOOL_DIR: ${{ github.event.inputs.tool_dir }}
      CREDENTIALS_JSON: ${{ github.event.inputs.credentials }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Determine tool name
        id: metadata
        run: |
          TOOL_NAME=$(basename "$TOOL_DIR")
          echo "TOOL_NAME=$TOOL_NAME" >> $GITHUB_ENV
          echo "tool_name=$TOOL_NAME" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Parse credentials and prepare .env file
        run: |
          echo "$CREDENTIALS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.AZURE_CONTAINER_REGISTRY }}/$TOOL_NAME:latest $TOOL_DIR

      - name: Push Docker Image
        run: |
          echo ${{ secrets.AZURE_ACR_PASSWORD }} | docker login ${{ secrets.AZURE_CONTAINER_REGISTRY }} -u ${{ secrets.AZURE_ACR_USERNAME }} --password-stdin
          docker push ${{ secrets.AZURE_CONTAINER_REGISTRY }}/$TOOL_NAME:latest

      - name: Deploy to Azure Container Apps
        run: |
          ENV_VARS=$(cat .env | sed 's/^/--env /' | tr '\n' ' ')
          az containerapp update \
            --name $TOOL_NAME \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/$TOOL_NAME:latest \
            $ENV_VARS

      - name: Save Deployment URL as Artifact
        run: |
          ENDPOINT=$(az containerapp show --name $TOOL_NAME --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          mkdir -p artifacts
          echo "https://$ENDPOINT" > artifacts/${TOOL_NAME}.txt
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: deployed-url-${{ env.TOOL_NAME }}
          path: artifacts/${{ env.TOOL_NAME }}.txt
