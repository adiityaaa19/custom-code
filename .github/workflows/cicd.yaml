name: Deploy App to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'ok/**'  # Updated to reflect the new folder name 'app'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy App

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: model-journal-454909-k1

      - name: Configure Docker to use Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t asia-south1-docker.pkg.dev/model-journal-454909-k1/toolmcp/app-service ./app  # Updated folder name

      - name: Push Docker image to Artifact Registry
        run: |
          docker push asia-south1-docker.pkg.dev/model-journal-454909-k1/toolmcp/app-service  # Updated folder name

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy app-service \
            --image asia-south1-docker.pkg.dev/model-journal-454909-k1/toolmcp/app-service \
            --platform managed \
            --region asia-south1 \
            --allow-unauthenticated
