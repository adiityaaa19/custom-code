name: Deploy Agent to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'app/**' 

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: model-journal-454909-k1

      - name: Configure Docker to use Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t asia-south1-docker.pkg.dev/model-journal-454909-k1/toolmcp/agent-service ./app

      - name: Push Docker image to Artifact Registry
        run: |
          docker push asia-south1-docker.pkg.dev/model-journal-454909-k1/toolmcp/agent-service

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy agent-service \
            --image asia-south1-docker.pkg.dev/model-journal-454909-k1/toolmcp/agent-service \
            --platform managed \
            --region asia-south1 \
            --allow-unauthenticated
